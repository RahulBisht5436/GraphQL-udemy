type Query{
    greetings: String
    Job(id:ID):Job
    Jobs :[Job]
    Company(id:ID!):Company
}

""" Root fields that change server-side data (writes). """
type Mutation {
    """
    Insert a new job. `companyId` must match an existing company row (foreign key in SQLite).
    Returns the saved `Job` so clients can query `id`, `title`, nested `company`, etc.
    """
    createJob(title: String!, description: String, companyId: ID!): Job
}
type Job {
    id:ID!
    title:String!
    description:String
    """ this is string date refrence """
    date:String!
    createdAt:String!
    company: Company

}

type Company {
    id:ID!
    name : String!
    description:String
    Jobs:[Job]
}