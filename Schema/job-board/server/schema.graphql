type Query{
    greetings: String
    Job(id:ID):Job
    Jobs :[Job]
    Company(id:ID!):Company
}


type Job {
    id:ID!
    title:String!
    description:String
    """ this is string date refrence """
    date:String!
    createdAt:String!
    company: Company


}

type Company {
    id:ID!
    name : String!
    description:String
    Jobs:[Job]
}